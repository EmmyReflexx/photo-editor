<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rex Photo</title>

  <link rel="icon" href="./assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <header>
      <h1 class="logo">Rex Photo</h1>
      <div class="theme-toggle" id="themeToggle">
        <span class="theme-icon" id="themeIcon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" fill="currentColor" />
          </svg>
        </span>
        <span class="theme-label" id="themeLabel">Dark</span>
      </div>
    </header>

    <main>
      <div id="editorContainer" class="editor-container">

        <!-- Top control section -->

        <div id="topControls" class="top-controls">

          <!-- Left Section: Upload, Undo, Redo -->

          <div class="controls-left">
            <button id="uploadBtn" class="control-btn primary-btn">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
                <polyline points="17 8 12 3 7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span>Upload Photo</span>
            </button>

            <div class="controls-divider"></div>

            <button id="undoBtn" class="control-btn" disabled title="Undo (Ctrl+Z)">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                <path d="M3 7v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-9 9" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="btn-text">Undo</span>
            </button>

            <button id="redoBtn" class="control-btn" disabled title="Redo (Ctrl+Y)">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                <path d="M21 7v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="btn-text">Redo</span>
            </button>

            <button id="resetBtn" class="control-btn" title="Reset All Filters">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                <path d="M1 4v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="btn-text">Reset</span>
            </button>
          </div>

          <!-- Right Section: Export Controls -->

          <div class="controls-right">
            <div class="export-group">
              <div class="format-selector">
                <label for="formatSelect" class="format-label">Format:</label>
                <select id="formatSelect" class="format-select">
                  <option value="jpeg">JPEG</option>
                  <option value="png">PNG</option>
                  <option value="webp">WebP</option>
                </select>
              </div>

              <div class="quality-control" id="qualityControl">
                <label class="quality-label">
                  <span>Quality:</span>
                  <span id="qualityValue" class="quality-value">90%</span>
                </label>
                <input type="range" id="qualitySlider" class="quality-slider" min="0" max="100" value="90" step="10">
                <div class="quality-marks">
                  <span class="quality-mark">Low</span>
                  <span class="quality-mark">Medium</span>
                  <span class="quality-mark">High</span>
                </div>
              </div>
            </div>

            <div class="controls-divider"></div>

            <button id="exportBtn" class="control-btn export-btn" disabled>
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
                <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span>Export</span>
            </button>
          </div>

        </div>

        <div id="photoContainer" class="drop-zone">
          <div class="container" id="imageContainer">
            <div class="upload-area" id="uploadArea">
              <input type="file" name="photo" id="photoInput" accept=".jpg,.jpeg,.png" style="display: none" />
              <div class="upload-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                    stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    fill="none" />
                  <circle cx="12" cy="13" r="4" stroke="var(--accent-color)" stroke-width="2" fill="var(--accent-color)"
                    opacity="0.3" />
                  <path d="M12 13V13.01" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" />
                  <path d="M17 8h.01" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" />
                </svg>
              </div>
              <div class="upload-text">
                Drag & Drop your image here or
                <span class="browse-text">browse</span>
              </div>
              <div class="upload-hint">Supports JPG, JPEG, PNG (Max 5MB)</div>
            </div>
          </div>
        </div>

        <div id="editorTools">


          <!-- this is the html to be rendered when tools are clicked -->


          <div id="inputElements">
            <div class="button">
              <button id="inputBackButton">Back</button>
            </div>
            <div id="inputName"></div>
            <div id="inputRangeElement">
              <p id="rangeInputValue"></p>
              <div id="rangeInputDiv">
                <input type="range" name="input-range" id="inputRange" value="0" max="100" min="-100" step="1">
              </div>
            </div>
          </div>

          <div id="inputSwitchElement">
            <button id="switchBackButton">Back</button>
            <div class="switch-container">
              <label class="switch">
                <input type="checkbox" id="inputSwitch">
                <span class="slider"></span>
              </label>
              <span class="switch-status" id="switchStatus">OFF</span>
            </div>
          </div>

          <div id="editorToolsDisplay">
            <div class="editor-tool" id="saturationTool">
              <div class="tool-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="10" stroke="var(--accent-color)" stroke-width="2" fill="none" />
                  <path d="M12 2a10 10 0 0 0 0 20" stroke="var(--accent-color)" stroke-width="2" fill="none" />
                  <circle cx="12" cy="12" r="6" fill="var(--accent-color)" opacity="0.3" />
                </svg>
              </div>
              <span>Saturation</span>
            </div>
            <div class="editor-tool" id="contrastTool">
              <div class="tool-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="8" height="8" fill="var(--accent-color)" opacity="0.8" />
                  <rect x="13" y="3" width="8" height="8" fill="var(--accent-color)" opacity="0.3" />
                  <rect x="3" y="13" width="8" height="8" fill="var(--accent-color)" opacity="0.3" />
                  <rect x="13" y="13" width="8" height="8" fill="var(--accent-color)" />
                </svg>
              </div>
              <span>Contrast</span>
            </div>
            <div class="editor-tool" id="brightnessTool">
              <div class="tool-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="5" stroke="var(--accent-color)" stroke-width="2" fill="var(--accent-color)"
                    opacity="0.3" />
                  <path d="M12 2v4M12 18v4M22 12h-4M6 12H2" stroke="var(--accent-color)" stroke-width="2"
                    stroke-linecap="round" />
                  <path d="M17.66 6.34l-2.83 2.83M9.17 14.83l-2.83 2.83M17.66 17.66l-2.83-2.83M9.17 9.17L6.34 6.34"
                    stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" />
                </svg>
              </div>
              <span>Brightness</span>
            </div>
            <!-- <div class="editor-tool" id="sepiaTool">
              <div class="tool-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="18" height="18" rx="2" stroke="var(--accent-color)" stroke-width="2"
                    fill="none" />
                  <path d="M3 3L21 21" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" />
                  <circle cx="9" cy="9" r="2" fill="var(--accent-color)" opacity="0.6" />
                  <circle cx="15" cy="15" r="2" fill="var(--accent-color)" opacity="0.4" />
                </svg>
              </div>
              <span>Sepia</span>
            </div>
            <div class="editor-tool" id="opacityTool">
              <div class="tool-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="18" height="18" rx="2" stroke="var(--accent-color)" stroke-width="2"
                    fill="var(--accent-color)" opacity="0.2" />
                  <path d="M3 3 L21 21" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" />
                  <rect x="3" y="3" width="18" height="9" fill="var(--accent-color)" opacity="0.6" />
                </svg>
              </div>
              <span>Opacity</span>
            </div> -->
          </diav>
        </div>
      </div>
  </div>
  </main>
  </div>

  <!-- <input type="text" id="input">
  <button type="button" id="push">Push</button> -->


  <canvas id="export-canvas" style="display: none;"></canvas>
  <script type="module" src="script.js"></script>
</body>

</html>
